# Local dev stack: the knowledge graph and app state.
# Start: docker compose up -d   ·   Neo4j Browser: http://localhost:7474 (neo4j / pitwall-dev-password)

services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # Neo4j Browser (web UI)
      - "7687:7687" # Bolt protocol (Python driver)
    environment:
      NEO4J_AUTH: neo4j/pitwall-dev-password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p pitwall-dev-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432" # host 5433, because a local Postgres already uses 5432
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
  postgres-data:
