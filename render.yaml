# Render Blueprint: the API on the free plan. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: pitwall-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PITWALL_OPENAI_API_KEY
        sync: false
      - key: PITWALL_NEO4J_URI
        sync: false
      - key: PITWALL_NEO4J_PASSWORD
        sync: false
      - key: PITWALL_DATABASE_URL
        sync: false
      - key: PITWALL_WEB_URL
        sync: false
      - key: PITWALL_API_URL
        sync: false
      - key: PITWALL_CORS_ORIGINS
        sync: false
      - key: PITWALL_SUPABASE_URL
        sync: false
      - key: PITWALL_IP_SALT
        generateValue: true
      - key: PITWALL_TELEGRAM_BOT_TOKEN
        sync: false
      - key: PITWALL_TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PITWALL_DAILY_USD_CAP
        value: "0.25"
